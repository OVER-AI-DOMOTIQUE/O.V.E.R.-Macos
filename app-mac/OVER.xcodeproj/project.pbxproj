			shellScript = "# Version Release (⇧⌘I, Product ▸ Archive pour l'App Store) : range Python 3.12 et les scripts d'O.V.E.R.\n# dans l'application (Contents/Resources) et les signe pour le bac à sable. L'emballage est obligatoire :\n# dans le bac à sable, l'application ne peut pas se servir du dossier O.V.E.R. En Debug (⌘R), elle l'utilise.\nif [ \"${CONFIGURATION}\" != \"Release\" ]; then\n  echo \"Version ${CONFIGURATION} : pas de Python embarqué (l'application utilise le dossier O.V.E.R.).\"\n  exit 0\nfi\nif [ ! -f \"${PROJECT_DIR:?}/build/Ressources/emballage.json\" ]; then\n  echo \"error: emballage absent : lance d'abord « bash app-mac/emballer.sh » (Terminal) jusqu'à « Emballage prêt », puis recommence.\"\n  exit 1\nfi\nbash \"${PROJECT_DIR:?}/embarquer.sh\" \"${TARGET_BUILD_DIR:?}/${WRAPPER_NAME:?}\" \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" appstore\n";
