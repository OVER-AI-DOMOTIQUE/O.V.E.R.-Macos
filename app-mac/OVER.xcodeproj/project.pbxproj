			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Range une copie de l'application à côté des scripts d'O.V.E.R. (le dossier qui contient app-mac).\n# Seulement la version Release (Product ▸ Build For ▸ Profiling, ⇧⌘I), pour l'essayer ; jamais pendant\n# Product ▸ Archive (la version pour l'App Store part de l'archive). La version Debug reste dans Xcode.\nif [ \"${CONFIGURATION}\" != \"Release\" ] || [ \"${ACTION}\" = \"install\" ]; then\n  echo \"${CONFIGURATION} ${ACTION} : pas de copie à côté des scripts.\"\n  exit 0\nfi\nDESTINATION=\"${PROJECT_DIR:?}/../${FULL_PRODUCT_NAME:?}\"\nrm -rf \"${DESTINATION}\"\nditto \"${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}\" \"${DESTINATION}\"\n# Xcode ne signe l'application qu'après cette étape : la copie est signée ici, avec la même identité,\n# les mêmes droits (bac à sable compris) et le Hardened Runtime. Sans signature, macOS ne garde pas l'accès au micro.\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" --timestamp=none --options runtime --entitlements \"${PROJECT_DIR:?}/${CODE_SIGN_ENTITLEMENTS:?}\" \"${DESTINATION}\" \\\n  || { echo \"error: la copie de OVER.app n'a pas pu être signée\"; exit 1; }\necho \"OVER.app signée et rangée dans ${DESTINATION}\"\n";
		};
