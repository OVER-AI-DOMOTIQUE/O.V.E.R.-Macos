		10C4B0128EB4E6271F1C3F28 /* Ranger OVER.app à côté des scripts */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
